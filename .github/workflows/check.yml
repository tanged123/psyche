name: Check settings
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Unix check tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh
      - name: Installer and shell behavior
        run: python scripts/test.py
      - name: Check Bash
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh bash/.bashrc bash/extras.bashrc
      - name: Unix entry point
        if: runner.os != 'Windows'
        run: bash scripts/install.sh --home "$RUNNER_TEMP/psyche preview" --dry-run
