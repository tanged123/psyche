# P10K-style colors inspired by Jessica Wang's Starship guide:
# https://github.com/theRubberDuckiee/dev-environment-files/blob/main/starship.toml
# Keep the familiar status symbols and both Git diff counts.
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = 'coolnight'

format = """
[](fg:mint)\
$os\
$username\
$hostname\
[](fg:mint bg:navy)\
$time\
[](fg:navy bg:blue)\
$directory\
[](fg:blue bg:yellow)\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
[](fg:yellow) \
$c\
$nix_shell\
$cmd_duration\
$character"""

[palettes.coolnight]
mint = '#7DF9AA'
navy = '#1C3A5E'
blue = '#3B76F0'
yellow = '#FCF392'
ink = '#090C0C'
text = '#E4E4E4'
added = '#146442'
deleted = '#9C2435'

[os]
disabled = false
format = '[ $symbol]($style)'
style = 'fg:ink bg:mint'

[username]
show_always = true
format = '[$user]($style)'
style_user = 'fg:ink bg:mint'
style_root = 'bold fg:deleted bg:mint'

[hostname]
ssh_only = false
format = '[@$hostname ]($style)'
style = 'fg:ink bg:mint'

[time]
disabled = false
time_format = '%R'
format = '[ 󱑍 $time ]($style)'
style = 'fg:mint bg:navy'

[directory]
format = '[  $path$read_only ]($style)'
style = 'bold fg:text bg:blue'
truncation_length = 3
truncation_symbol = '…/'
read_only = ' '
read_only_style = 'fg:text bg:blue'

[git_branch]
symbol = '🌱 '
format = '[ $symbol$branch ]($style)'
style = 'fg:navy bg:yellow'

[git_commit]
only_detached = false
format = '[\($hash$tag\) ]($style)'
style = 'fg:navy bg:yellow'
tag_symbol = '🔖 '

[git_state]
format = '[\($state( $progress_current/$progress_total)\) ]($style)'
style = 'bold fg:deleted bg:yellow'

[git_metrics]
disabled = false
format = '[+$added]($added_style)[/-$deleted ]($deleted_style)'
added_style = 'fg:added bg:yellow'
deleted_style = 'fg:deleted bg:yellow'

[git_status]
format = '([$all_status$ahead_behind ]($style))'
style = 'fg:navy bg:yellow'
conflicted = '🏳'
ahead = '🏎💨'
behind = '😰'
diverged = '😵'
up_to_date = ''
untracked = '🤷'
stashed = '📦'
modified = '📝'
staged = '[++\($count\)](fg:added bg:yellow)'
renamed = '👅'
deleted = '🗑'

[nix_shell]
disabled = false
impure_msg = '[impure](bold red)'
pure_msg = '[pure](bold green)'
format = 'via [$symbol$state]($style) '
symbol = '❄️  '

[cmd_duration]
min_time = 2000
format = '[󱎫 $duration ](bold yellow)'

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red)'

[nodejs]
symbol = '⬢ '
style = 'bold green'

[python]
symbol = '🐍 '
style = 'yellow'

[rust]
symbol = '🦀 '
style = 'bold red'

[golang]
symbol = '🐹 '
style = 'bold cyan'
