# ~/.config/starship.toml

add_newline = true

# -----------------------------------------------------------
# GLOBAL FORMAT
# -----------------------------------------------------------
# We place the C/C++ module right after the directory
format = """
$username\
$hostname\
$directory\
$c\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$nix_shell\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

# -----------------------------------------------------------
# NIX SHELL (The Snowflake)
# -----------------------------------------------------------
[nix_shell]
disabled = false
impure_msg = '[impure](bold red)'
pure_msg = '[pure](bold green)'
format = 'via [$symbol$state]($style) '
symbol = '❄️  '

# -----------------------------------------------------------
# GIT: VERBOSE CONFIGURATION
# -----------------------------------------------------------
[git_branch]
symbol = "🌱 "
style = "bold purple"

[git_commit]
# Shows the commit hash/tag even if you are on a branch
only_detached = false
# Shows the tag if available, otherwise the first 7 chars of hash
format = "[\\($hash$tag\\)]($style) "
style = "bold yellow"
tag_symbol = "🔖 "

[git_metrics]
# Shows how many lines added/deleted
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = "[+$added]($added_style)/[-$deleted]($deleted_style) "

[git_status]
conflicted = "🏳"
ahead = "🏎💨"
behind = "😰"
diverged = "😵"
up_to_date = ""
untracked = "🤷"
stashed = "📦"
modified = "📝"
staged = '[++\($count\)](green)'
renamed = "👅"
deleted = "🗑"

# -----------------------------------------------------------
# OTHER LANGUAGES
# -----------------------------------------------------------
[nodejs]
symbol = "⬢ "
style = "bold green"

[python]
symbol = "🐍 "
style = "yellow"

[rust]
symbol = "🦀 "
style = "bold red"

[golang]
symbol = "🐹 "
style = "bold cyan"

# -----------------------------------------------------------
# SYSTEM INFO
# -----------------------------------------------------------
[username]
style_user = "white bold"
style_root = "black bold red"
format = "[$user]($style) "
show_always = true

[hostname]
ssh_only = false
format = "on [$hostname](bold red) "
disabled = false

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold blue"

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "
